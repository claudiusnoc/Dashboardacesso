project_id = "claro-acessos-mg"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "https://claudiusnoc.github.io/Dashboardacesso/"
additional_redirect_urls = [
  "http://localhost:5177",
  "http://127.0.0.1:5177",
  "https://claudiusnoc.github.io/Dashboardacesso/",
  "https://claudiusnoc.github.io/Dashboardacesso/casos",
]
enable_signup = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"
